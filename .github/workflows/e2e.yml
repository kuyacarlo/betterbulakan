name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge service data
        run: python3 scripts/merge_services.py

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      # Chromium only; visual and a11y tags run in their own jobs below
      - name: Run E2E tests
        run: pnpm run test:e2e --project=chromium --grep-invert "@visual|@a11y"
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Blob Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-blob-report
          path: blob-report/
          retention-days: 7

  e2e-visual:
    name: E2E Visual Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    # Same image the committed chromium-linux baselines were generated in, so rendering matches.
    # Regenerate with the same image: podman run ... playwright test --project=chromium --grep @visual --update-snapshots
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge service data
        run: python3 scripts/merge_services.py

      # Browsers ship with the container image; no playwright install needed
      - name: Run visual regression tests
        run: pnpm exec playwright test --project=chromium --grep @visual
        env:
          CI: true
          HOME: /root

      - name: Upload visual regression results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-regression-report
          path: test-results/
          retention-days: 7

  e2e-accessibility:
    name: E2E Accessibility Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge service data
        run: python3 scripts/merge_services.py

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      # Axe scans of every public route (scripts/lib/site-routes.js) against a production build
      - name: Run accessibility tests
        run: pnpm exec playwright test --project=chromium --grep @a11y
        env:
          CI: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accessibility-report
          path: blob-report/
          retention-days: 7
