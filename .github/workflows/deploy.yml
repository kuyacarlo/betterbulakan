name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

# Production hosting is Vercel (GitHub integration on kuyacarlo/betterbulakan).
# Keep this workflow as a quality gate only; skip Cloudflare Pages deploy.
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Quality Gate
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Merge service data
        run: python3 scripts/merge_services.py

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Build
        run: pnpm run build
